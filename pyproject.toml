[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-header-analyzer"
version = "0.2.1"
description = "Defensive email header analyzer for phishing triage. Outputs JSON/Markdown reports."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Black" }]

[project.scripts]
phishing-header-analyzer = "phishing_header_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
